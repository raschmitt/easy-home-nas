# Copy to ansible/inventory.ini (git-ignored) and adjust.

[nas]
# --- Running on the same machine you're setting up (this project's own case) ---
localhost ansible_connection=local

# --- Replicating onto a different machine over SSH ---
# nas-host ansible_host=192.168.1.50 ansible_user=youruser

[nas:vars]
# The Linux user who owns the GNOME desktop session that must never suspend.
# Only relevant on Ubuntu Desktop targets (skip/override on Ubuntu Server).
tandem_desktop_user=youruser
