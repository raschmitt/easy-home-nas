---
# See the same pattern (and the reasoning) in zfs-mirror/tasks/main.yml —
# apt's exit code can reflect an unrelated broken package on a long-lived
# desktop, not a problem with the packages this role actually needs.
- name: Install baseline hardening packages
  ansible.builtin.apt:
    name:
      - ufw
      - unattended-upgrades
    state: present
    update_cache: true
  register: tandem_hardening_apt_result
  failed_when: false

- name: Verify hardening packages actually configured, regardless of apt's exit code
  ansible.builtin.command: "dpkg-query -W -f='${Status}' {{ item }}"
  register: tandem_hardening_pkg_check
  changed_when: false
  failed_when: false
  loop:
    - ufw
    - unattended-upgrades

- name: Fail with a clear message if a hardening package isn't actually installed
  ansible.builtin.assert:
    that:
      - "'install ok installed' in item.stdout"
    fail_msg: >-
      {{ item.item }} did not end up correctly installed. apt reported:
      {{ tandem_hardening_apt_result.msg | default('see output above') }}
      This is often caused by an UNRELATED broken package on a long-lived
      desktop (e.g. a DKMS driver failing to build against a pending kernel
      upgrade) rather than a problem with this package itself — check
      `sudo apt-get install -f` output before re-running this role.
    quiet: true
  loop: "{{ tandem_hardening_pkg_check.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51-tandem-nas-unattended.conf
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Allow SSH through ufw (matching the port already in use)
  community.general.ufw:
    rule: limit
    port: "{{ tandem_ssh_port }}"
    proto: tcp

- name: Allow HTTP/HTTPS through ufw (Caddy/Nextcloud public access)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"

- name: Allow any extra project-defined ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ tandem_ufw_extra_allow_tcp }}"

- name: Set default deny incoming / allow outgoing
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Enable ufw
  community.general.ufw:
    state: enabled

- name: SSH hardening (opt-in — see TANDEM_HARDEN_SSH in .env.example)
  when: tandem_harden_ssh | bool
  block:
    - name: Refuse to disable password auth without a verified authorized_keys file
      ansible.builtin.stat:
        path: "/home/{{ tandem_desktop_user | default(ansible_user_id) }}/.ssh/authorized_keys"
      register: tandem_authorized_keys

    - name: Fail if no SSH key is on file for the admin user
      ansible.builtin.assert:
        that:
          - tandem_authorized_keys.stat.exists
          - tandem_authorized_keys.stat.size > 0
        fail_msg: >-
          TANDEM_HARDEN_SSH is true but no authorized_keys file was found
          for the admin user. Add your SSH public key first, or this would
          lock you out of the machine entirely.
        quiet: true

    - name: Disable SSH password authentication
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-tandem-nas.conf
        mode: "0644"
        content: |
          PasswordAuthentication no
          PermitRootLogin no
          KbdInteractiveAuthentication no
      notify: Restart sshd
