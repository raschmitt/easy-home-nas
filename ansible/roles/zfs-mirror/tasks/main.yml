---
# On a desktop already in use for years, `apt` can fail on packages
# completely unrelated to ZFS (e.g. a third-party DKMS driver that doesn't
# build against a pending kernel upgrade) — dpkg reports the whole
# transaction as failed even though zfsutils-linux itself configured fine.
# Don't let that unrelated breakage block this role: verify the actual
# packages we need instead of trusting apt's aggregate exit code.
- name: Install ZFS and auto-snapshot tooling
  ansible.builtin.apt:
    name:
      - zfsutils-linux
      - zfs-auto-snapshot
    state: present
    update_cache: true
  register: tandem_zfs_apt_result
  failed_when: false

- name: Verify zfsutils-linux and zfs-auto-snapshot actually configured, regardless of apt's exit code
  ansible.builtin.command: "dpkg-query -W -f='${Status}' {{ item }}"
  register: tandem_zfs_pkg_check
  changed_when: false
  failed_when: false
  loop:
    - zfsutils-linux
    - zfs-auto-snapshot

- name: Fail with a clear message if ZFS tooling isn't actually installed
  ansible.builtin.assert:
    that:
      - "'install ok installed' in item.stdout"
    fail_msg: >-
      {{ item.item }} did not end up correctly installed. apt reported:
      {{ tandem_zfs_apt_result.msg | default('see output above') }}
      This is often caused by an UNRELATED broken package on a long-lived
      desktop (e.g. a DKMS driver failing to build against a pending kernel
      upgrade) rather than a problem with ZFS itself — check
      `sudo apt-get install -f` output and consider `apt-mark hold` on the
      offending kernel package, or removing the broken driver, before
      re-running this role.
    quiet: true
  loop: "{{ tandem_zfs_pkg_check.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Ensure the zfs kernel module loads at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/zfs.conf
    content: "zfs\n"
    mode: "0644"

- name: Load the zfs kernel module now
  community.general.modprobe:
    name: zfs
    state: present

- name: Check whether the pool already exists
  ansible.builtin.command: "zpool list -H -o name {{ tandem_zfs_pool_name }}"
  register: tandem_zfs_pool_check
  changed_when: false
  failed_when: false

- name: Safety check — refuse to touch disks that already carry a filesystem
  when: tandem_zfs_pool_check.rc != 0
  block:
    - name: Probe each target disk for existing signatures
      ansible.builtin.command: "blkid {{ item }}"
      register: tandem_zfs_blkid
      changed_when: false
      failed_when: false
      loop: "{{ tandem_zfs_disks }}"

    - name: Fail if a disk already has a filesystem/partition signature
      ansible.builtin.assert:
        that:
          - item.rc != 0
        fail_msg: >-
          {{ item.item }} already has a filesystem/partition signature
          ({{ item.stdout }}). Creating the ZFS pool would destroy that data.
          If you are certain this disk is meant to be wiped, set
          TANDEM_ZFS_CONFIRM_WIPE=true in .env and re-run.
        quiet: true
      loop: "{{ tandem_zfs_blkid.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not (tandem_zfs_confirm_wipe | bool)

- name: Create the mirrored pool
  # -f is only added once TANDEM_ZFS_CONFIRM_WIPE is true — the safety check
  # above already required that same flag before it would let a disk with an
  # existing signature reach this point, so forcing past zpool's own stale
  # EFI-label/signature warning here is consistent with a confirmation the
  # operator already gave, not a separate silent override.
  ansible.builtin.command: >
    zpool create -o ashift={{ tandem_zfs_ashift }}
    {{ '-f' if (tandem_zfs_confirm_wipe | bool) else '' }}
    {{ tandem_zfs_pool_name }} mirror {{ tandem_zfs_disks | join(' ') }}
  when: tandem_zfs_pool_check.rc != 0
  changed_when: true

- name: Enable transparent compression on the pool
  community.general.zfs:
    name: "{{ tandem_zfs_pool_name }}"
    state: present
    extra_zfs_properties:
      compression: lz4

- name: Ensure the Nextcloud data mount path exists
  ansible.builtin.file:
    path: "{{ tandem_zfs_mountpoint_nextcloud }}"
    state: directory
    mode: "0750"

- name: Create/configure the Nextcloud dataset
  community.general.zfs:
    name: "{{ tandem_zfs_dataset_nextcloud }}"
    state: present
    extra_zfs_properties:
      mountpoint: "{{ tandem_zfs_mountpoint_nextcloud }}"
      atime: "off"
      xattr: sa

- name: Apply a space reservation for the Nextcloud dataset (optional headroom)
  community.general.zfs:
    name: "{{ tandem_zfs_dataset_nextcloud }}"
    state: present
    extra_zfs_properties:
      reservation: "{{ tandem_zfs_reservation }}"
  when: tandem_zfs_reservation | length > 0

- name: Enable monthly scrub timer for self-healing checksum verification
  ansible.builtin.systemd:
    name: "zfs-scrub-monthly@{{ tandem_zfs_pool_name }}.timer"
    enabled: true
    state: started

# zfs-auto-snapshot on Debian/Ubuntu schedules itself via
# /etc/cron.{hourly,daily,weekly,monthly}/zfs-auto-snapshot (installed and
# active as soon as the package is installed above) rather than systemd
# timers — there is nothing to enable here. Each cron script runs
# `zfs-auto-snapshot --label=<period> --keep=<n> //`, i.e. every pool/dataset,
# with retention already sane out of the box (24 hourly, 31 daily, 8 weekly,
# 12 monthly). Remove /etc/cron.d/zfs-auto-snapshot if you don't want the
# additional every-15-minutes "frequent" snapshots.
