[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
# The whole ansible-playbook process is expected to be launched already
# elevated (e.g. via `pkexec`, which prompts graphically through the
# desktop's polkit agent instead of reading a password from stdin). Once the
# process itself is root, `sudo` for individual tasks succeeds without a
# further prompt (pam_rootok), so Ansible should not also try to read a
# become password itself.
become_ask_pass = False
