# SSH admin access is not part of the public Nextcloud exposure, but it's
# reachable on the internet like any other port, so it gets the same
# ban-on-repeated-failure treatment. This jail is monitor-only: it never
# edits sshd_config, so it carries no lockout risk by itself.
[sshd]
enabled = true
filter = sshd
logpath = /var/log/auth.log
maxretry = 5
findtime = 10m
bantime = 1h
banaction = iptables-multiport
